name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  daemon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
        working-directory: daemon
      - run: bun run check
        working-directory: daemon
        env:
          CI: "true"
  protocol:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path protocol/swift
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo -c /repo/.gitleaks.toml --redact --no-banner
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit is signed off
        run: |
          missing=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" | awk 'NF < 2 { print $1 }')
          if [ -n "$missing" ]; then echo "Commits without Signed-off-by (git commit -s):"; echo "$missing"; exit 1; fi
